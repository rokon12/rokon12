---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
{% include head.html %}
<body class="{% if page.layout == 'post' %}article-page{% else %}editorial-page{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="article-wrap">
        {% include site-header.html %}
        <main id="main-content">{{ content }}</main>
        {% include site-footer.html %}
    </div>
    <script defer src="{{ '/assets/js/article-theme.js' | relative_url }}"></script>
    {% if page.layout == 'post' %}<script defer src="{{ '/assets/js/post-enhancements.js' | relative_url }}?v=2"></script>{% endif %}
</body>
</html>
